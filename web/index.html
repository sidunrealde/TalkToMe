<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Avatar</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Avatar</h1>
        </header>
        
        <main>
            <!-- Avatar Display -->
            <div class="avatar-container">
                <video id="avatar-video" autoplay playsinline></video>
                <img id="avatar-image" src="" alt="Avatar">
                <div id="avatar-placeholder">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <p>Upload an avatar to begin</p>
                </div>
                <!-- State overlay indicators on avatar -->
                <div id="avatar-state-overlay" class="hidden">
                    <div class="state-indicator" id="state-listening">
                        <div class="pulse-ring"></div>
                        <span>🎤 Listening...</span>
                    </div>
                    <div class="state-indicator" id="state-thinking">
                        <div class="thinking-dots"><span></span><span></span><span></span></div>
                        <span>Thinking...</span>
                    </div>
                    <div class="state-indicator" id="state-speaking">
                        <div class="sound-wave">
                            <span></span><span></span><span></span><span></span><span></span>
                        </div>
                        <span>Speaking...</span>
                    </div>
                </div>
            </div>
            
            <!-- Audio Level Meter -->
            <div class="audio-meter-container">
                <label>🎤 Mic Level:</label>
                <div class="audio-meter">
                    <div class="audio-meter-bar" id="audio-meter-bar"></div>
                </div>
                <span id="audio-level-text">0%</span>
            </div>
            
            <!-- Controls -->
            <div class="controls">
                <!-- Avatar Upload -->
                <div class="control-group">
                    <label for="avatar-upload">Avatar Image:</label>
                    <input type="file" id="avatar-upload" accept="image/*">
                </div>
                
                <!-- Voice Selection -->
                <div class="control-group">
                    <label for="voice-select">Voice:</label>
                    <select id="voice-select">
                        <optgroup label="🇺🇸 American Female">
                            <option value="af_heart">Heart ❤️ (Top Quality)</option>
                            <option value="af_bella">Bella 🔥</option>
                            <option value="af_nicole">Nicole 🎧</option>
                            <option value="af_sarah">Sarah</option>
                            <option value="af_sky">Sky</option>
                            <option value="af_alloy">Alloy</option>
                            <option value="af_aoede">Aoede</option>
                            <option value="af_jessica">Jessica</option>
                            <option value="af_kore">Kore</option>
                            <option value="af_nova">Nova</option>
                            <option value="af_river">River</option>
                        </optgroup>
                        <optgroup label="🇺🇸 American Male">
                            <option value="am_adam">Adam</option>
                            <option value="am_michael">Michael</option>
                            <option value="am_fenrir">Fenrir</option>
                            <option value="am_puck">Puck</option>
                            <option value="am_echo">Echo</option>
                            <option value="am_eric">Eric</option>
                            <option value="am_liam">Liam</option>
                            <option value="am_onyx">Onyx</option>
                            <option value="am_santa">Santa 🎅</option>
                        </optgroup>
                        <optgroup label="🇬🇧 British Female">
                            <option value="bf_emma">Emma</option>
                            <option value="bf_isabella">Isabella</option>
                            <option value="bf_alice">Alice</option>
                            <option value="bf_lily">Lily</option>
                        </optgroup>
                        <optgroup label="🇬🇧 British Male">
                            <option value="bm_george">George</option>
                            <option value="bm_lewis">Lewis</option>
                            <option value="bm_daniel">Daniel</option>
                            <option value="bm_fable">Fable</option>
                        </optgroup>
                        <optgroup label="🇯🇵 Japanese">
                            <option value="jf_alpha">Alpha (Female)</option>
                            <option value="jf_gongitsune">Gongitsune (Female)</option>
                            <option value="jf_nezumi">Nezumi (Female)</option>
                            <option value="jf_tebukuro">Tebukuro (Female)</option>
                            <option value="jm_kumo">Kumo (Male)</option>
                        </optgroup>
                        <optgroup label="🇨🇳 Mandarin Chinese">
                            <option value="zf_xiaobei">Xiaobei (Female)</option>
                            <option value="zf_xiaoni">Xiaoni (Female)</option>
                            <option value="zf_xiaoxiao">Xiaoxiao (Female)</option>
                            <option value="zf_xiaoyi">Xiaoyi (Female)</option>
                            <option value="zm_yunjian">Yunjian (Male)</option>
                            <option value="zm_yunxi">Yunxi (Male)</option>
                            <option value="zm_yunxia">Yunxia (Male)</option>
                            <option value="zm_yunyang">Yunyang (Male)</option>
                        </optgroup>
                        <optgroup label="🇪🇸 Spanish">
                            <option value="ef_dora">Dora (Female)</option>
                            <option value="em_alex">Alex (Male)</option>
                            <option value="em_santa">Santa (Male) 🎅</option>
                        </optgroup>
                        <optgroup label="🇫🇷 French">
                            <option value="ff_siwis">Siwis (Female)</option>
                        </optgroup>
                        <optgroup label="🇮🇳 Hindi">
                            <option value="hf_alpha">Alpha (Female)</option>
                            <option value="hf_beta">Beta (Female)</option>
                            <option value="hm_omega">Omega (Male)</option>
                            <option value="hm_psi">Psi (Male)</option>
                        </optgroup>
                        <optgroup label="🇮🇹 Italian">
                            <option value="if_sara">Sara (Female)</option>
                            <option value="im_nicola">Nicola (Male)</option>
                        </optgroup>
                        <optgroup label="🇧🇷 Brazilian Portuguese">
                            <option value="pf_dora">Dora (Female)</option>
                            <option value="pm_alex">Alex (Male)</option>
                            <option value="pm_santa">Santa (Male) 🎅</option>
                        </optgroup>
                    </select>
                </div>
                
                <!-- Connection -->
                <div class="control-group">
                    <button id="connect-btn" class="primary">Connect</button>
                    <button id="disconnect-btn" disabled>Disconnect</button>
                </div>
            </div>
            
            <!-- Connection Status -->
            <div class="status">
                <span id="connection-status" class="status-disconnected">⚫ Disconnected</span>
            </div>
            
            <!-- Text Input -->
            <div class="text-input-container">
                <input type="text" id="text-input" placeholder="Type a message..." disabled>
                <button id="send-btn" disabled>Send</button>
            </div>
            
            <!-- Conversation Display with real-time transcription -->
            <div class="conversation-container">
                <h3>Conversation</h3>
                <div class="conversation" id="conversation">
                    <div class="empty-state">Start a conversation by connecting and speaking or typing...</div>
                </div>
                <!-- Live transcription indicator -->
                <div id="live-transcription" class="live-transcription hidden">
                    <span class="transcribing-indicator">●</span>
                    <span id="live-text"></span>
                </div>
            </div>
            
            <!-- Debug Log -->
            <details>
                <summary>Debug Log</summary>
                <div class="transcript" id="transcript"></div>
            </details>
        </main>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
